name: Fix STAR PDF Windows identity
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg==2.8.2 pillow==12.0.0
      - run: python3 packaging/windows/apply-star-pdf-identity.py
        env:
          GH_TOKEN: ${{ github.token }}
